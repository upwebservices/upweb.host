<!-- UPWeb Services – New Project Announcement Section -->
<section id="upweb-announcement" style="--accent:#ff4c60; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin:0; padding:4rem 1rem; background:#fafafa; text-align:center; position:relative; overflow:hidden;">
  <style>
    #upweb-announcement h2{
      font-size:2.5rem;
      margin-bottom:0.5rem;
      color:#222;
    }
    #upweb-announcement p{
      max-width:48rem;
      margin:0.5rem auto 2rem;
      line-height:1.6;
      color:#555;
      font-size:1.125rem;
    }
    #upweb-announcement .cta-btn{
      display:inline-block;
      background:var(--accent);
      color:#fff;
      padding:0.9rem 2.25rem;
      border-radius:4px;
      text-decoration:none;
      font-weight:600;
      transition:background .3s, transform .3s;
      box-shadow:0 4px 10px rgba(0,0,0,.15);
    }
    #upweb-announcement .cta-btn:hover{
      background:darken(var(--accent),5%);
      transform:translateY(-2px);
    }
    /* Decorative floating qrs */
    #upweb-announcement svg.qr{
      position:absolute;
      opacity:.08;
      width:120px; height:120px;
      fill:#000;
      animation: float 20s linear infinite;
    }
    #upweb-announcement svg.qr:nth-child(1){top:5%;left:3%;animation-duration:22s;}
    #upweb-announcement svg.qr:nth-child(2){bottom:8%;right:5%;animation-duration:18s;}
    #upweb-announcement svg.qr:nth-child(3){top:30%;right:10%;animation-duration:25s;}

    @keyframes float{
      from{transform:translateY(-20px) rotate(0deg);} to{transform:translateY(20px) rotate(360deg);}
    }
    @media(max-width:600px){
      #upweb-announcement h2{font-size:2rem;}
      #upweb-announcement p{font-size:1rem;}
    }
  </style>

  <!-- Content -->
  <h2>Introducing Online Menu SaaS for Restaurants</h2>
  <p>
    UPWeb Services, in collaboration with <strong>EISystems</strong>, proudly presents our latest project – a powerful subscription platform that lets you publish interactive online menus, generate QR codes, and manage your restaurants effortlessly.
  </p>
  <a href="#" class="cta-btn" id="upweb-get-started">Get Started</a>

  <!-- Decorative background QR shapes -->
  <svg class="qr" viewBox="0 0 24 24"><rect width="24" height="24"/></svg>
  <svg class="qr" viewBox="0 0 24 24"><rect width="24" height="24"/></svg>
  <svg class="qr" viewBox="0 0 24 24"><rect width="24" height="24"/></svg>

  <!-- Minimal JS for CTA behavior -->
  <script>
    document.getElementById('upweb-get-started').addEventListener('click', function(e){
      e.preventDefault();
      window.location.href = '/signup'; // Change to the actual sign-up URL
    });
  </script>
</section>
