<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#shipGradient)"/>
  
  <!-- Ship Icon -->
  <g transform="translate(50, 50)">
    <!-- Hull -->
    <path d="M -25 5 L -20 15 L 20 15 L 25 5 Z" fill="white" opacity="0.9"/>
    
    <!-- Mast -->
    <rect x="-2" y="-20" width="4" height="25" fill="white"/>
    
    <!-- Sail -->
    <path d="M 2 -18 Q 15 -10, 2 0" fill="white" opacity="0.8"/>
    <path d="M -2 -15 Q -12 -8, -2 2" fill="white" opacity="0.8"/>
    
    <!-- Waves -->
    <path d="M -30 18 Q -20 16, -10 18 T 10 18 T 30 18" 
          stroke="white" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M -30 22 Q -20 20, -10 22 T 10 22 T 30 22" 
          stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
</svg>